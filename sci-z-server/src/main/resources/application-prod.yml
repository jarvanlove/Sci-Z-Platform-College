# 生产环境：通过 spring.config.import 引入类路径下的占位符属性文件
spring: # Spring 生产环境配置
  config:
    import: optional:classpath:config/production.env.properties # 生产占位符属性
    # 🔥 修复：指定 properties 文件使用 UTF-8 编码读取（解决中文乱码问题）
    encoding:
      charset: UTF-8
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres # 数据库 URL（建议改为生产地址）
    #url: jdbc:postgresql://localhost:5438/sci-z-college # 数据库 URL（建议改为生产地址）
    username: ${DB_USERNAME:postgres} # 数据库用户名（支持环境变量覆盖）
    password: ${DB_PASSWORD:password} # 数据库密码（支持环境变量覆盖）
    driver-class-name: org.postgresql.Driver # PostgreSQL 驱动
    hikari:
      maximum-pool-size: 30 # 最大连接数（生产更大）
      minimum-idle: 8 # 最小空闲连接数
      connection-timeout: 20000 # 获取连接超时时间(ms)
      idle-timeout: 600000 # 空闲连接存活时长(ms)
      max-lifetime: 1800000 # 连接最大存活时长(ms)
  redis:
    host: ${REDIS_HOST:localhost} # Redis 主机
    port: ${REDIS_PORT:6379} # Redis 端口
    password: ${REDIS_PASSWORD:} # Redis 密码
    database: 0 # 使用的数据库索引
    timeout: ${REDIS_TIMEOUT:10000ms} # 连接与命令超时
    lettuce:
      pool:
        max-active: ${REDIS_POOL_MAX_ACTIVE:8} # 最大连接数
        max-wait: ${REDIS_POOL_MAX_WAIT:-1ms} # 最大等待时间
        max-idle: ${REDIS_POOL_MAX_IDLE:8} # 最大空闲连接
        min-idle: ${REDIS_POOL_MIN_IDLE:0} # 最小空闲连接
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:500MB} # 单文件最大大小
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:500MB} # 单次请求总大小

# 生产 Kafka：默认从环境变量读取集群地址
kafka: # Kafka 生产环境配置
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka1:9092,kafka2:9092}
  producer:
    acks: all # 最强一致性
    retries: 3 # 重试次数
    linger-ms: 10 # 聚合延迟(ms)

# MinIO：从环境变量读取 endpoint/ak/sk/bucket
minio: # MinIO 生产环境配置
  endpoint: ${MINIO_ENDPOINT:http://192.168.1.203:9110}
  access-key: ${MINIO_AK}
  secret-key: ${MINIO_SK}
  bucket: ${MINIO_BUCKET:sciz-files}

# Dify：生产密钥请使用环境变量/密钥管理注入
dify: # Dify 生产环境配置
  http:
    connect-timeout-ms: ${DIFY_CONNECT_TIMEOUT_MS:3000} # 连接超时(ms)
    read-timeout-ms: ${DIFY_READ_TIMEOUT_MS:60000} # 读超时(ms)
  base-url: ${DIFY_BASE_URL:http://192.168.1.203/v1} # Dify API 网关
  private-url: ${DIFY_PRIVATE_URL:http://192.168.1.203} # Dify 私有地址
  api-key: ${DIFY_API_KEY} # 生产密钥（请从环境注入）
  api-workflow-key: ${DIFY_API_WORKFLOW_KEY} # Dify API 工作流密钥（请从环境注入）
  timeout: ${DIFY_TIMEOUT:30000} # 请求超时(ms)
  connect-timeout: ${DIFY_CONNECT_TIMEOUT:30000} # 连接超时(ms)
  retry-count: ${DIFY_RETRY_COUNT:3} # 重试次数
  enable-retry: ${DIFY_ENABLE_RETRY:true} # 是否启用重试
  default-resource-id: ${DIFY_DEFAULT_RESOURCE_ID:default} # 默认资源ID（用于创建知识库时的resourceId参数）
  chatbot: # Chatbot 模型配置（生产环境）
    pre-prompt: ${DIFY_CHATBOT_PRE_PROMPT:"你叫小域，是一位专业、严谨的学术助手，专注于科研与教学支持。请以清晰、准确、逻辑严密的方式回答问题，语言应符合学术规范，避免口语化、夸张或情绪化表达。若涉及数据、方法或结论，请注明假设条件与适用范围；若问题存在歧义或信息不足，请明确指出并请求澄清；优先使用正式术语，必要时可提供定义或简要解释；不使用表情符号、颜文字或非必要的修饰性语言；回答应结构清晰，可适当使用标题、编号或表格以提升可读性，但需保持内容精炼。请根据上述原则，就用户提出的问题提供专业、可靠、有依据的回应。"}
    prompt-type: ${DIFY_CHATBOT_PROMPT_TYPE:simple} # 提示词类型
    opening-statement: ${DIFY_CHATBOT_OPENING_STATEMENT:""} # 开场白
    suggested-questions: ${DIFY_CHATBOT_SUGGESTED_QUESTIONS:[]} # 建议问题列表
    dataset-query-variable: ${DIFY_CHATBOT_DATASET_QUERY_VARIABLE:""} # 数据集查询变量
    more-like-this: ${DIFY_CHATBOT_MORE_LIKE_THIS:false} # 更多类似内容开关
    speech-to-text: ${DIFY_CHATBOT_SPEECH_TO_TEXT:false} # 语音转文字开关
    text-to-speech: ${DIFY_CHATBOT_TEXT_TO_SPEECH:false} # 文字转语音开关
    suggested-questions-after-answer: ${DIFY_CHATBOT_SUGGESTED_QUESTIONS_AFTER_ANSWER:false} # 回答后建议问题开关
    retriever-resource: ${DIFY_CHATBOT_RETRIEVER_RESOURCE:true} # 检索资源开关
    sensitive-word-avoidance: # 敏感词规避配置
      enabled: ${DIFY_CHATBOT_SENSITIVE_WORD_AVOIDANCE_ENABLED:false}
      type: ${DIFY_CHATBOT_SENSITIVE_WORD_AVOIDANCE_TYPE:""}
      configs: ${DIFY_CHATBOT_SENSITIVE_WORD_AVOIDANCE_CONFIGS:[]}
    file-upload: # 文件上传配置
      enabled: ${DIFY_CHATBOT_FILE_UPLOAD_ENABLED:false}
      allowed-file-types: ${DIFY_CHATBOT_FILE_UPLOAD_ALLOWED_TYPES:[]}
      allowed-file-extensions: ${DIFY_CHATBOT_FILE_UPLOAD_ALLOWED_EXTENSIONS:[".JPG", ".JPEG", ".PNG", ".GIF", ".WEBP", ".SVG", ".MP4", ".MOV", ".MPEG", ".WEBM"]}
      allowed-file-upload-methods: ${DIFY_CHATBOT_FILE_UPLOAD_METHODS:["remote_url", "local_file"]}
      number-limits: ${DIFY_CHATBOT_FILE_UPLOAD_NUMBER_LIMITS:3}
      image:
        enabled: ${DIFY_CHATBOT_FILE_UPLOAD_IMAGE_ENABLED:false}
        detail: ${DIFY_CHATBOT_FILE_UPLOAD_IMAGE_DETAIL:high}
        number-limits: ${DIFY_CHATBOT_FILE_UPLOAD_IMAGE_NUMBER_LIMITS:3}
        transfer-methods: ${DIFY_CHATBOT_FILE_UPLOAD_IMAGE_TRANSFER_METHODS:["remote_url", "local_file"]}
    agent-mode: # Agent模式配置
      enabled: ${DIFY_CHATBOT_AGENT_MODE_ENABLED:false}
      max-iteration: ${DIFY_CHATBOT_AGENT_MODE_MAX_ITERATION:10}
      strategy: ${DIFY_CHATBOT_AGENT_MODE_STRATEGY:function_call}
      tools: ${DIFY_CHATBOT_AGENT_MODE_TOOLS:[]}
    model: # 模型配置
      provider: ${DIFY_CHATBOT_MODEL_PROVIDER:langgenius/tongyi/tongyi} # 模型提供商
      name: ${DIFY_CHATBOT_MODEL_NAME:qwen3-next-80b-a3b-instruct} # 模型名称
      mode: ${DIFY_CHATBOT_MODEL_MODE:chat} # 模型模式（chat/completion）
      completion-params: # 完成参数配置
        enable-search: ${DIFY_CHATBOT_MODEL_COMPLETION_PARAMS_ENABLE_SEARCH:false} # 是否启用搜索
    reranking-model: # 重排序模型配置
      reranking-provider-name: ${DIFY_CHATBOT_RERANKING_PROVIDER:langgenius/tongyi/tongyi} # 重排序提供商名称
      reranking-model-name: ${DIFY_CHATBOT_RERANKING_MODEL_NAME:gte-rerank} # 重排序模型名称
    dataset-configs: # 数据集配置
      retrieval-model: ${DIFY_CHATBOT_DATASET_RETRIEVAL_MODEL:multiple} # 检索模型
      top-k: ${DIFY_CHATBOT_DATASET_TOP_K:4} # Top K
      reranking-mode: ${DIFY_CHATBOT_DATASET_RERANKING_MODE:reranking_model} # 重排序模式
      reranking-enable: ${DIFY_CHATBOT_DATASET_RERANKING_ENABLE:false} # 是否启用重排序
      datasets: # 数据集集合
        datasets:
          - dataset:
              enabled: ${DIFY_CHATBOT_DATASET_ENABLED:true}
              id: ${DIFY_CHATBOT_DATASET_ID:""}

# LLM：OpenAI 兼容，建议用环境变量提供密钥与模型
llm: # LLM(OpenAI) 生产环境配置
  openai:
    api-key: ${LLM_API_KEY} # OpenAI API Key（环境注入）
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1} # OpenAI Base URL
    model: ${LLM_MODEL:gpt-4o-mini} # 默认模型（可覆盖）
    timeout-seconds: 60 # 接口超时(s)

# 阿里云短信服务配置
sms: # 短信服务配置
  aliyun: # 阿里云短信服务配置
    enabled: ${SMS_ALIYUN_ENABLED:true} # 是否启用阿里云短信服务
    region-id: ${SMS_ALIYUN_REGION_ID:cn-hangzhou} # 区域ID
    access-key-id: ${SMS_ALIYUN_ACCESS_KEY_ID:} # 阿里云 AccessKey ID
    access-key-secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:} # 阿里云 AccessKey Secret
    sign-name: ${SMS_ALIYUN_SIGN_NAME:上海中域工业互联网研究院} # 短信签名名称
    template-code: ${SMS_ALIYUN_TEMPLATE_CODE:} # 短信模板代码
    template-param-name: ${SMS_ALIYUN_TEMPLATE_PARAM_NAME:code} # 模板参数名称

# 阿里云翻译服务配置
aliyun: # 阿里云服务配置
  translation: # 翻译服务配置
    access-key-id: ${ALIYUN_TRANSLATION_ACCESS_KEY_ID:} # 阿里云 AccessKey ID
    access-key-secret: ${ALIYUN_TRANSLATION_ACCESS_KEY_SECRET:} # 阿里云 AccessKey Secret
    endpoint: ${ALIYUN_TRANSLATION_ENDPOINT:mt.cn-hangzhou.aliyuncs.com} # 翻译服务端点

# Actuator（prod）：最小暴露，仅 health、info；健康详情不展示
# 健康检查端点可用于：
# 1. 负载均衡器（Nginx、HAProxy）的健康检查
# 2. 监控系统（Prometheus、Zabbix）的指标采集
# 3. 运维人员手动检查服务状态
management:
  endpoints:
    web:
      exposure:
        include: "*" # 生产环境仅暴露健康检查和基本信息
  endpoint:
    health:
      show-details: always # 生产环境不显示详细信息（避免泄露敏感信息）
