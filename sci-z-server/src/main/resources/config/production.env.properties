# ==================== 数据库与缓存 ====================
# PostgreSQL 数据库用户名
DB_USERNAME=postgres
# PostgreSQL 数据库密码（生产环境请使用强密码）
DB_PASSWORD=postgres
# Redis 服务器地址
REDIS_HOST=192.168.1.203
# Redis 服务器端口（默认 6379）
REDIS_PORT=6379
# Redis 密码（如无密码则留空）
REDIS_PASSWORD=

# ==================== 消息队列与对象存储 ====================
# Kafka 集群地址（多个地址用逗号分隔，格式：host1:port1,host2:port2）
KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092
# MinIO 对象存储服务地址（格式：http://host:port）
MINIO_ENDPOINT=http://192.168.1.203:9110
# MinIO 访问密钥（Access Key）
MINIO_AK=minioadmin
# MinIO 秘密密钥（Secret Key）
MINIO_SK=minioadmin
# MinIO 存储桶名称
MINIO_BUCKET=sciz-files

# ==================== 外部 API 与 AI 能力 ====================
# Dify 配置
# Dify API 网关地址（格式：http://host:port/v1）
DIFY_BASE_URL=http://192.168.1.203/v1
# Dify 私有地址（用于内部服务调用，格式：http://host:port）
DIFY_PRIVATE_URL=http://192.168.1.203
# Dify API 密钥（知识库类型，用于知识库相关操作）
DIFY_API_KEY=dataset-MwOxGbIDhZmg6bUdHEid0rhX
# Dify API 工作流密钥（工作流类型，用于工作流相关操作）
DIFY_API_WORKFLOW_KEY=app-TsSdGbD50r8fDt1shM3RBSMi
# Dify 请求超时时间（毫秒，默认 30000）
DIFY_TIMEOUT=30000
# Dify 连接超时时间（毫秒，默认 30000）
DIFY_CONNECT_TIMEOUT=30000
# Dify HTTP 连接超时时间（毫秒，默认 3000）
DIFY_CONNECT_TIMEOUT_MS=3000
# Dify HTTP 读取超时时间（毫秒，默认 60000）
DIFY_READ_TIMEOUT_MS=60000
# Dify 请求失败重试次数（默认 3）
DIFY_RETRY_COUNT=3
# Dify 是否启用重试机制（true/false，默认 true）
DIFY_ENABLE_RETRY=true
# Dify 默认资源ID（用于创建知识库时的 resourceId 参数，默认 default）
DIFY_DEFAULT_RESOURCE_ID=default
# Dify 文件上传存储目录（相对路径，相对于项目根目录，默认 /tmp/upload）
DIFY_UPLOAD_DIR=/tmp/upload
# Dify 文件上传最大文件大小（字节，104857600 = 100MB，默认 100MB）
DIFY_UPLOAD_MAX_FILE_SIZE=104857600
# Dify 文件上传允许的文件扩展名（逗号分隔，默认支持常见文档和图片格式）
DIFY_UPLOAD_ALLOWED_EXTENSIONS=.pdf,.doc,.docx,.txt,.md,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.gif
# Dify Chatbot 模型提供商（格式：provider/type，默认 langgenius/tongyi/tongyi）
DIFY_CHATBOT_MODEL_PROVIDER=langgenius/tongyi/tongyi
# Dify Chatbot 模型名称（默认 qwen3-next-80b-a3b-instruct）
DIFY_CHATBOT_MODEL_NAME=qwen3-next-80b-a3b-instruct
# Dify Chatbot 模型模式（chat/completion，默认 chat）
DIFY_CHATBOT_MODEL_MODE=chat
# Dify Chatbot 重排序模型提供商（格式：provider/type，默认 langgenius/tongyi/tongyi）
DIFY_CHATBOT_RERANKING_PROVIDER=langgenius/tongyi/tongyi
# Dify Chatbot 重排序模型名称（默认 gte-rerank）
DIFY_CHATBOT_RERANKING_MODEL_NAME=gte-rerank
# LLM 配置
# LLM API 密钥（OpenAI 兼容接口的 API Key，生产环境请从密钥管理系统获取）
LLM_API_KEY=
# LLM API 基础地址（OpenAI 兼容接口的 Base URL，默认 https://api.openai.com/v1）
LLM_BASE_URL=https://api.openai.com/v1
# LLM 默认模型名称（默认 gpt-4o-mini）
LLM_MODEL=gpt-4o-mini

# ==================== 认证与上传配置 ====================
# Sa-Token 登录令牌超时时间（秒，2592000 = 30天，默认 30天）
SA_TOKEN_TIMEOUT=2592000
# 文件上传单文件最大大小（支持单位：B、KB、MB、GB，默认 500MB）
MULTIPART_MAX_FILE_SIZE=500MB
# 文件上传单次请求总大小（支持单位：B、KB、MB、GB，默认 500MB）
MULTIPART_MAX_REQUEST_SIZE=500MB

# ==================== 邮箱服务商配置 ====================
## Gmail (OAuth) 配置
# 是否启用 Gmail 邮件服务（true/false，默认 false）
MAIL_GMAIL_ENABLED=false
# Gmail OAuth Token 获取地址
MAIL_GMAIL_TOKEN_URL=https://oauth2.googleapis.com/token
# Gmail OAuth 客户端ID（从 Google Cloud Console 获取）
MAIL_GMAIL_CLIENT_ID=
# Gmail OAuth 客户端密钥（从 Google Cloud Console 获取）
MAIL_GMAIL_CLIENT_SECRET=
# Gmail OAuth 刷新令牌（用于获取访问令牌）
MAIL_GMAIL_REFRESH_TOKEN=
# Gmail OAuth 权限范围（默认 https://www.googleapis.com/auth/gmail.send）
MAIL_GMAIL_SCOPE=https://www.googleapis.com/auth/gmail.send
# Gmail 用户ID（用于发送邮件的用户标识）
MAIL_GMAIL_USER_ID=
# Gmail 邮件发送API地址（%s 会被替换为 MAIL_GMAIL_USER_ID）
MAIL_GMAIL_SEND_URL=https://gmail.googleapis.com/gmail/v1/users/%s/messages/send

## Outlook (Graph OAuth) 配置
# 是否启用 Outlook 邮件服务（true/false，默认 false）
MAIL_OUTLOOK_ENABLED=false
# Outlook OAuth Token 获取地址（%s 会被替换为 MAIL_OUTLOOK_TENANT_ID）
MAIL_OUTLOOK_TOKEN_URL=https://login.microsoftonline.com/%s/oauth2/v2.0/token
# Outlook OAuth 租户ID（默认 common，表示多租户应用）
MAIL_OUTLOOK_TENANT_ID=common
# Outlook OAuth 客户端ID（从 Azure Portal 获取）
MAIL_OUTLOOK_CLIENT_ID=
# Outlook OAuth 客户端密钥（从 Azure Portal 获取）
MAIL_OUTLOOK_CLIENT_SECRET=
# Outlook OAuth 刷新令牌（用于获取访问令牌）
MAIL_OUTLOOK_REFRESH_TOKEN=
# Outlook OAuth 权限范围（默认 https://graph.microsoft.com/.default offline_access）
MAIL_OUTLOOK_SCOPE=https://graph.microsoft.com/.default offline_access
# Outlook 用户ID（用于发送邮件的用户标识）
MAIL_OUTLOOK_USER_ID=
# Outlook 邮件发送API地址（%s 会被替换为 MAIL_OUTLOOK_USER_ID）
MAIL_OUTLOOK_SEND_URL=https://graph.microsoft.com/v1.0/users/%s/sendMail

## 网易企业邮 (SMTP) 配置
# 是否启用网易企业邮邮件服务（true/false，默认 false）
MAIL_NETEASE_ENABLED=false
# 网易企业邮 SMTP 服务器地址（默认 smtp.163.com）
MAIL_NETEASE_HOST=smtp.163.com
# 网易企业邮 SMTP 服务器端口（默认 465，SSL 端口）
MAIL_NETEASE_PORT=465
# 网易企业邮 SMTP 用户名（通常是完整的邮箱地址）
MAIL_NETEASE_USERNAME=
# 网易企业邮 SMTP 密码（可能是邮箱密码或授权码）
MAIL_NETEASE_PASSWORD=
# 网易企业邮发件人邮箱地址
MAIL_NETEASE_FROM=
# 是否启用 SSL 加密（true/false，默认 true）
MAIL_NETEASE_SSL=true
# 是否启用 STARTTLS（true/false，默认 false，与 SSL 互斥）
MAIL_NETEASE_STARTTLS=false

## QQ 邮箱 (SMTP) 配置
# 是否启用 QQ 邮箱邮件服务（true/false，默认 false）
MAIL_QQ_ENABLED=false
# QQ 邮箱 SMTP 服务器地址（默认 smtp.qq.com）
MAIL_QQ_HOST=smtp.qq.com
# QQ 邮箱 SMTP 服务器端口（默认 465，SSL 端口）
MAIL_QQ_PORT=465
# QQ 邮箱 SMTP 用户名（通常是完整的邮箱地址）
MAIL_QQ_USERNAME=
# QQ 邮箱 SMTP 密码（需要使用授权码，不是邮箱密码）
MAIL_QQ_PASSWORD=
# QQ 邮箱发件人邮箱地址
MAIL_QQ_FROM=
# 是否启用 SSL 加密（true/false，默认 true）
MAIL_QQ_SSL=true
# 是否启用 STARTTLS（true/false，默认 false，与 SSL 互斥）
MAIL_QQ_STARTTLS=false

# ==================== 短信服务 (Twilio) 配置 ====================
# 是否启用 Twilio 短信服务（true/false，默认 false）
SMS_TWILIO_ENABLED=false
# Twilio 账户SID（从 Twilio Console 获取）
SMS_TWILIO_ACCOUNT_SID=
# Twilio 认证令牌（从 Twilio Console 获取）
SMS_TWILIO_AUTH_TOKEN=
# Twilio 发送短信的源号码（从 Twilio Console 获取，格式：+1234567890）
SMS_TWILIO_FROM_NUMBER=
# Twilio API 基础地址（默认 https://api.twilio.com/2010-04-01）
SMS_TWILIO_API_URL=https://api.twilio.com/2010-04-01

# ==================== 短信服务 (阿里云) 配置 ====================
# 是否启用阿里云短信服务（true/false，默认 false）
SMS_ALIYUN_ENABLED=false
# 阿里云短信服务区域ID（默认 cn-hangzhou，表示杭州区域）
SMS_ALIYUN_REGION_ID=cn-hangzhou
# 阿里云 AccessKey ID（从阿里云控制台获取）
SMS_ALIYUN_ACCESS_KEY_ID=
# 阿里云 AccessKey Secret（从阿里云控制台获取）
SMS_ALIYUN_ACCESS_KEY_SECRET=
# 阿里云短信签名名称（默认 SCI-Z，需要在阿里云短信服务中配置）
SMS_ALIYUN_SIGN_NAME=SCI-Z
# 阿里云短信模板代码（需要在阿里云短信服务中创建模板并获取代码）
SMS_ALIYUN_TEMPLATE_CODE=
# 阿里云短信模板参数名称（用于替换模板中的变量，默认 code）
SMS_ALIYUN_TEMPLATE_PARAM_NAME=code
