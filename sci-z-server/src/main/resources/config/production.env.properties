# ==================== 数据库与缓存 ====================
# PostgreSQL 数据库连接 URL（格式：jdbc:postgresql://host:port/database）
DB_URL=jdbc:postgresql://localhost:5432/postgres
#DB_URL=jdbc:postgresql://localhost:5438/sci-z-college
# PostgreSQL 数据库用户名
DB_USERNAME=postgres
# PostgreSQL 数据库密码（生产环境请使用强密码）
DB_PASSWORD=postgres
# Redis 服务器地址
REDIS_HOST=127.0.0.1
# Redis 服务器端口（默认 6379）
REDIS_PORT=6379
# Redis 密码（如无密码则留空）
REDIS_PASSWORD=

# ==================== 消息队列与对象存储 ====================
# Kafka 集群地址（多个地址用逗号分隔，格式：host1:port1,host2:port2）
KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092
# MinIO 对象存储服务地址（格式：http://host:port）
MINIO_ENDPOINT=http://192.168.1.203:9110
# MinIO 访问密钥（Access Key）
MINIO_AK=minioadmin
# MinIO 秘密密钥（Secret Key）
MINIO_SK=minioadmin
# MinIO 存储桶名称
MINIO_BUCKET=internal-sciz-files
#MINIO_BUCKET=sciz-files

