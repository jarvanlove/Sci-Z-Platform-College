# ==================== 邮箱服务商配置 ====================
## Gmail (OAuth) 配置
# 是否启用 Gmail 邮件服务（true/false，默认 false）
MAIL_GMAIL_ENABLED=false
# Gmail OAuth Token 获取地址
MAIL_GMAIL_TOKEN_URL=https://oauth2.googleapis.com/token
# Gmail OAuth 客户端ID（从 Google Cloud Console 获取）
MAIL_GMAIL_CLIENT_ID=
# Gmail OAuth 客户端密钥（从 Google Cloud Console 获取）
MAIL_GMAIL_CLIENT_SECRET=
# Gmail OAuth 刷新令牌（用于获取访问令牌）
MAIL_GMAIL_REFRESH_TOKEN=
# Gmail OAuth 权限范围（默认 https://www.googleapis.com/auth/gmail.send）
MAIL_GMAIL_SCOPE=https://www.googleapis.com/auth/gmail.send
# Gmail 用户ID（用于发送邮件的用户标识）
MAIL_GMAIL_USER_ID=
# Gmail 邮件发送API地址（%s 会被替换为 MAIL_GMAIL_USER_ID）
MAIL_GMAIL_SEND_URL=https://gmail.googleapis.com/gmail/v1/users/%s/messages/send

## Outlook (Graph OAuth) 配置
# 是否启用 Outlook 邮件服务（true/false，默认 false）
MAIL_OUTLOOK_ENABLED=false
# Outlook OAuth Token 获取地址（%s 会被替换为 MAIL_OUTLOOK_TENANT_ID）
MAIL_OUTLOOK_TOKEN_URL=https://login.microsoftonline.com/%s/oauth2/v2.0/token
# Outlook OAuth 租户ID（默认 common，表示多租户应用）
MAIL_OUTLOOK_TENANT_ID=common
# Outlook OAuth 客户端ID（从 Azure Portal 获取）
MAIL_OUTLOOK_CLIENT_ID=
# Outlook OAuth 客户端密钥（从 Azure Portal 获取）
MAIL_OUTLOOK_CLIENT_SECRET=
# Outlook OAuth 刷新令牌（用于获取访问令牌）
MAIL_OUTLOOK_REFRESH_TOKEN=
# Outlook OAuth 权限范围（默认 https://graph.microsoft.com/.default offline_access）
MAIL_OUTLOOK_SCOPE=https://graph.microsoft.com/.default offline_access
# Outlook 用户ID（用于发送邮件的用户标识）
MAIL_OUTLOOK_USER_ID=
# Outlook 邮件发送API地址（%s 会被替换为 MAIL_OUTLOOK_USER_ID）
MAIL_OUTLOOK_SEND_URL=https://graph.microsoft.com/v1.0/users/%s/sendMail

## 网易企业邮 (SMTP) 配置
# 是否启用网易企业邮邮件服务（true/false，默认 false）
MAIL_NETEASE_ENABLED=false
# 网易企业邮 SMTP 服务器地址（默认 smtp.163.com）
MAIL_NETEASE_HOST=smtp.163.com
# 网易企业邮 SMTP 服务器端口（默认 465，SSL 端口）
MAIL_NETEASE_PORT=465
# 网易企业邮 SMTP 用户名（通常是完整的邮箱地址）
MAIL_NETEASE_USERNAME=
# 网易企业邮 SMTP 密码（可能是邮箱密码或授权码）
MAIL_NETEASE_PASSWORD=
# 网易企业邮发件人邮箱地址
MAIL_NETEASE_FROM=
# 是否启用 SSL 加密（true/false，默认 true）
MAIL_NETEASE_SSL=true
# 是否启用 STARTTLS（true/false，默认 false，与 SSL 互斥）
MAIL_NETEASE_STARTTLS=false

## QQ 邮箱 (SMTP) 配置
# 是否启用 QQ 邮箱邮件服务（true/false，默认 false）
MAIL_QQ_ENABLED=false
# QQ 邮箱 SMTP 服务器地址（默认 smtp.qq.com）
MAIL_QQ_HOST=smtp.qq.com
# QQ 邮箱 SMTP 服务器端口（默认 465，SSL 端口）
MAIL_QQ_PORT=465
# QQ 邮箱 SMTP 用户名（通常是完整的邮箱地址）
MAIL_QQ_USERNAME=
# QQ 邮箱 SMTP 密码（需要使用授权码，不是邮箱密码）
MAIL_QQ_PASSWORD=
# QQ 邮箱发件人邮箱地址
MAIL_QQ_FROM=
# 是否启用 SSL 加密（true/false，默认 true）
MAIL_QQ_SSL=true
# 是否启用 STARTTLS（true/false，默认 false，与 SSL 互斥）
MAIL_QQ_STARTTLS=false

