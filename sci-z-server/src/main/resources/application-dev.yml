spring: # Spring 开发环境配置
  datasource:
    #url: jdbc:postgresql://localhost:5432/sci-z-college # 本地数据库 URL
    url: jdbc:postgresql://192.168.1.203:5438/sci-z-college # 本地数据库 URL
    username: postgres # 本地数据库用户名
    password: postgres # 本地数据库密码
    driver-class-name: org.postgresql.Driver # PostgreSQL 驱动
    hikari:
      maximum-pool-size: 10 # 最大连接数
      minimum-idle: 5 # 最小空闲连接数
      connection-timeout: 30000 # 获取连接超时时间(ms)
      idle-timeout: 600000 # 空闲连接存活时长(ms)
      max-lifetime: 1800000 # 连接最大存活时长(ms)
  redis:
    host: localhost # Redis 主机
    port: 6379 # Redis 端口
    password: # Redis 密码（如无则留空）
    database: 0 # 使用的数据库索引
    timeout: 10000ms # 连接与命令超时
    lettuce:
      pool:
        max-active: 8 # 最大连接数
        max-wait: -1ms # 连接最大等待时间（-1 表示无限）
        max-idle: 8 # 最大空闲连接
        min-idle: 0 # 最小空闲连接
  servlet:
    multipart:
      max-file-size: 200MB # 单文件最大大小
      max-request-size: 200MB # 单次请求总大小

  # 本地 kafka
  bootstrap-servers: localhost:9092
  producer:
    acks: 1 # 生产者确认级别
    retries: 1 # 发送失败重试次数
    linger-ms: 0 # 聚合延迟(ms)
  consumer:
    group-id: sciz-dev # 默认消费组
    auto-offset-reset: earliest # 偏移量不存在时从最早消费

# 本地 MinIO（默认控制台/存储均为本机）
minio: # MinIO 开发环境配置
  endpoint: http://192.168.1.203:9110
  access-key: minioadmin
  secret-key: minioadmin
  bucket: sciz-files

dify:
  http:
    connect-timeout-ms: 5000 # 连接超时(ms)
    read-timeout-ms: 60000 # 读超时(ms)
  base-url: http://192.168.1.203/v1
  private-url: http://192.168.1.203
  api-key: dataset-MwOxGbIDhZmg6bUdHEid0rhX # Dify API 测试知识库 密钥
  api-workflow-key: app-TsSdGbD50r8fDt1shM3RBSMi # Dify API 测试工作流密钥
  timeout: 30000
  connect-timeout: 30000
  retry-count: 3
  enable-retry: true
  default-resource-id: default # 默认资源ID（用于创建知识库时的resourceId参数）
  chatbot: # Chatbot 模型配置（开发环境）
    pre-prompt: "你叫小域，是一位专业、严谨的学术助手，专注于科研与教学支持。请以清晰、准确、逻辑严密的方式回答问题，语言应符合学术规范，避免口语化、夸张或情绪化表达。若涉及数据、方法或结论，请注明假设条件与适用范围；若问题存在歧义或信息不足，请明确指出并请求澄清；优先使用正式术语，必要时可提供定义或简要解释；不使用表情符号、颜文字或非必要的修饰性语言；回答应结构清晰，可适当使用标题、编号或表格以提升可读性，但需保持内容精炼。请根据上述原则，就用户提出的问题提供专业、可靠、有依据的回应。"
    prompt-type: simple # 提示词类型
    opening-statement: "" # 开场白
    suggested-questions: [] # 建议问题列表
    dataset-query-variable: "" # 数据集查询变量
    more-like-this: false # 更多类似内容开关
    speech-to-text: false # 语音转文字开关
    text-to-speech: false # 文字转语音开关
    suggested-questions-after-answer: false # 回答后建议问题开关
    retriever-resource: true # 检索资源开关
    sensitive-word-avoidance: # 敏感词规避配置
      enabled: false
      type: ""
      configs: []
    file-upload: # 文件上传配置
      enabled: false
      allowed-file-types: []
      allowed-file-extensions: [".JPG", ".JPEG", ".PNG", ".GIF", ".WEBP", ".SVG", ".MP4", ".MOV", ".MPEG", ".WEBM"]
      allowed-file-upload-methods: ["remote_url", "local_file"]
      number-limits: 3
      image:
        enabled: false
        detail: high
        number-limits: 3
        transfer-methods: ["remote_url", "local_file"]
    agent-mode: # Agent模式配置
      enabled: false
      max-iteration: 10
      strategy: function_call
      tools: []
    model: # 模型配置
      provider: langgenius/tongyi/tongyi # 模型提供商
      name: qwen3-max # 模型名称
      mode: chat # 模型模式（chat/completion）
      completion-params: # 完成参数配置
        enable-search: false # 是否启用搜索
    reranking-model: # 重排序模型配置
      reranking-provider-name: langgenius/tongyi/tongyi # 重排序提供商名称
      reranking-model-name: gte-rerank # 重排序模型名称
    dataset-configs: # 数据集配置
      retrieval-model: multiple # 检索模型
      top-k: 4 # Top K
      reranking-mode: reranking_model # 重排序模式
      reranking-enable: false # 是否启用重排序
      datasets: # 数据集集合
        datasets:
          - dataset:
              enabled: true
              id: ""
# LLM 开发环境配置（OpenAI 兼容接口）
llm: # LLM(OpenAI) 开发环境配置
  openai:
    api-key: YOUR_DEV_LLM_KEY # OpenAI API Key（示例）
    base-url: https://api.openai.com/v1 # OpenAI Base URL
    model: gpt-4o-mini # 默认模型
    timeout-seconds: 60 # 接口超时(s)

# 阿里云短信服务配置
sms: # 短信服务配置
  aliyun: # 阿里云短信服务配置
    enabled: true # 是否启用阿里云短信服务
    region-id: cn-hangzhou # 区域ID（默认：杭州区域）
    access-key-id: YOUR_ALIYUN_ACCESS_KEY_ID # 阿里云 AccessKey ID（请通过环境变量设置）
    access-key-secret: YOUR_ALIYUN_ACCESS_KEY_SECRET # 阿里云 AccessKey Secret（请通过环境变量设置）
    sign-name: 上海中域工业互联网研究院 # 短信签名名称
    template-code: SMS_501280080 # 短信模板代码（需要在阿里云短信服务中创建模板并获取代码）
    template-param-name: code # 模板参数名称（用于替换模板中的变量，默认 code）

# 阿里云翻译服务配置
aliyun: # 阿里云服务配置
  translation: # 翻译服务配置
    access-key-id: YOUR_ALIYUN_ACCESS_KEY_ID # 阿里云 AccessKey ID（请通过环境变量设置）
    access-key-secret: YOUR_ALIYUN_ACCESS_KEY_SECRET # 阿里云 AccessKey Secret（请通过环境变量设置）
    endpoint: mt.cn-hangzhou.aliyuncs.com # 翻译服务端点（默认：杭州区域）

# 开发环境日志更详细：调试业务与 Web/MyBatis 行为
logging:
  level:
    com.sciz.server: DEBUG
    org.springframework.web: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.mybatis: DEBUG

# Actuator（dev）：开放全部端点，健康详情完全展示
management:
  endpoints:
    web:
      exposure:
        include: "*" # 开发环境开放所有端点
  endpoint:
    health:
      show-details: always # 开发环境显示详细信息
