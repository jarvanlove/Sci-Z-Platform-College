server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 字符集
    charset utf-8;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/x-javascript 
        application/xml+rss 
        application/json 
        application/javascript
        application/xml
        image/svg+xml;

    # 静态资源缓存（长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API 代理 - 后端服务（流式响应支持）
    location /api {
        proxy_pass http://backend:8808;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 🔥 关键：禁用代理缓冲，支持流式输出（SSE/EventStream）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # 禁用 gzip 压缩（流式响应不应压缩）
        gzip off;
        
        # 超时设置（流式响应可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;  # 增加发送超时
        proxy_read_timeout 300s;  # 增加读取超时（流式响应需要）
        
        # 立即刷新响应（不等待缓冲区满）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # 🔥 专门为流式接口配置（更严格的流式支持）
    # 匹配流式接口路径：/api/chat/workflow/run 和 /api/knowledge/chatbot/stream
    location ~ ^/api/(chat/workflow/run|knowledge/chatbot/stream) {
        proxy_pass http://backend:8808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 🔥 强制禁用所有缓冲和缓存（关键配置）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        # 禁用 gzip 压缩（流式响应不应压缩，压缩会缓冲数据）
        gzip off;
        
        # 设置流式响应头
        proxy_set_header Accept 'text/event-stream';
        add_header Cache-Control 'no-cache' always;
        add_header X-Accel-Buffering 'no' always;  # 禁用 Nginx 缓冲（关键）
        
        # 超时设置（流式响应需要更长的超时时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;  # 10分钟
        proxy_read_timeout 600s;  # 10分钟
        
        # 立即传递响应（不等待缓冲区满）
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
    }

    # 前端路由支持（Vue Router history 模式）
    # 所有非文件、非目录的请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # 禁用 index.html 的缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

