# 科研平台 
server {
    listen 8707;
    server_name sci-z-platform;
    charset utf-8;

    # 静态资源根目录
    root C:\qyw\project\sci-z-platform\dist;
    index index.html;

    # 🔥 专门为流式接口配置（必须在 /api/ 之前，优先级更高）
    # 匹配流式接口路径：/api/chat/workflow/run 和 /api/knowledge/chatbot/stream
    location ~ ^/api/(chat/workflow/run|knowledge/chatbot/stream) {
        proxy_pass http://127.0.0.1:8808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 🔥 强制禁用所有缓冲和缓存（关键配置，解决流式输出问题）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        # 禁用 gzip 压缩（流式响应不应压缩，压缩会缓冲数据）
        gzip off;
        
        # 设置流式响应头
        proxy_set_header Accept 'text/event-stream';
        add_header Cache-Control 'no-cache' always;
        add_header X-Accel-Buffering 'no' always;  # 禁用 Nginx 缓冲（关键）
        
        # 超时设置（流式响应需要更长的超时时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;  # 10分钟
        proxy_read_timeout 600s;  # 10分钟
        
        # 立即传递响应（不等待缓冲区满）
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
    }

    # API 请求代理到后端（普通 API 请求）
    location /api/ {
        proxy_pass http://127.0.0.1:8808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 🔥 为所有 API 请求也禁用缓冲（确保流式输出正常工作）
        # 如果只想对特定接口禁用缓冲，可以删除这里的配置，只保留上面的流式接口配置
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # 禁用 gzip 压缩（避免影响流式响应）
        gzip off;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 前端路由：所有非 API 请求都返回 index.html，让前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
        
        # 禁用 index.html 的缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}


